name: Kelivo
description: "An LLM chat client for Android."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# Android: build-name maps to versionName and build-number maps to versionCode.
version: 1.3.4+84

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.9"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  dart_quill_delta: ^10.8.3
  hotkey_manager: ^0.2.3

  # Localizations for Arabic, Simplified Chinese, Traditional Chinese and English UI strings
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  collection: ^1.19.1
  dynamic_color: ^1.8.1
  material_color_utilities: ^0.13.0
  lucide_icons_flutter: ^3.1.13
  shared_preferences: ^2.2.3
  image_picker: 1.1.2
  image_cropper: ^12.2.1
  flutter_svg: ^2.2.1
  fl_chart: 1.3.0
  http: ^1.5.0
  yaml: ^3.1.3
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.3
  pointycastle: ^4.0.0
  hashlib: ^2.4.2
  ffi: ^2.2.0
  dio: 5.9.2
  socks5_proxy: ^2.1.1
  jose: ^0.3.4
  flutter_slidable: ^3.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.2
  # Align on Win32 6.x; super_native_extensions is pinned to the matching device_info_plus-compatible release below.
  package_info_plus: ^10.2.2
  markstream:
    path: dependencies/markstream
  uuid: ^4.5.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.4
  file_picker: ^12.3.0
  archive: ^4.5.2
  # Keep XML at 7.0.1: the local vector_graphics_compiler package caps it at <=7.0.1.
  xml: 7.0.1
  open_filex: ^4.5.0
  easy_image_viewer: ^1.4.6
  # Keep the modern Win32 6.x line required by file_picker 12 and secure storage 11.
  share_plus: ^13.3.1
  pretty_qr_code: ^3.5.0
  mobile_scanner: ^7.0.1
  mcp_client: # ^1.0.2
    path: ./dependencies/mcp_client
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  re_editor:
    path: ./dependencies/re_editor
  # Syncfusion 33.2.13+1 updates the PDF package to xml 7.0.1.
  # Keep the shared core, sliders and PDF packages on the same compatible line.
  syncfusion_flutter_core: ^33.2.13+1
  syncfusion_flutter_sliders: ^33.2.13+1
  syncfusion_flutter_pdf: ^33.2.13+1
  audioplayers: ^6.5.1
  record: ^7.1.1
  sherpa_onnx: 1.12.20
  speech_to_text: ^7.4.0
  html: ^0.15.6
  html2md: ^1.2.10
  http_parser: ^4.1.2
  animations: ^2.0.11
  flutter_animate: ^4.5.2
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.14.1
  flutter_inappwebview: ^6.1.5
  liquid_glass_widgets:
    path: ./dependencies/liquid_glass_widgets
  flutter_math_fork: # ^0.7.4
    path: ./dependencies/flutter_math_fork
  scrollable_positioned_list: ^0.3.8
  super_sliver_list: ^0.4.1
  image_gallery_saver_plus: ^4.0.1
  haptic_feedback: ^0.6.4+3
  # Keep clipboard facade and native implementation on the same compatibility release.
  super_clipboard: 0.10.0-dev.2
  permission_handler: ^12.0.3
  flutter_tts:
    path: ./dependencies/flutter_tts
  flutter_local_notifications: ^17.2.3
  image: ^4.8.0
  downsize:
    path: ./dependencies/downsize
  # Align with xml 7.0.1 and file_picker_linux/dbus, which require PetitParser 7.x.
  petitparser: 7.0.2
  rational: ^2.2.3
  decimal: ^3.2.6

  restart_app: ^1.8.3
  drift: ^2.35.3
  sqlite3: ^3.3.3
  reel_text: ^0.4.3
  # Pin 1.8.0 exactly: 1.8.1 changed dbus to ^0.8.0, which conflicts with
  # flutter_local_notifications 17.2.x -> flutter_local_notifications_linux 4.0.1 (dbus ^0.7.8).
  # Wakelock 1.8.0 already contains the Win32 6.x / package_info_plus 10.x updates.
  wakelock_plus: 1.8.0
  diffutil_dart: ^5.0.0
  glob: ^2.2.0
  terminal_view: # ^0.2.1
    path: ./dependencies/terminal_view

dev_dependencies:
  vector_graphics_compiler: ^1.3.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  webview_flutter_platform_interface: ^2.15.1
  build_runner: ^2.4.0
  drift_dev: ^2.35.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

  path_provider_platform_interface: ^2.1.3
  timezone: ^0.9.4
  # Required by super_native_extensions 0.10.0-dev.2; 0.7.0 conflicts with its channel API line.
  irondash_message_channel: ^0.8.0-dev.0
  # 0.9.1 caps device_info_plus below 12 (Win32 5); dev.2 supports device_info_plus 13 (Win32 6).
  super_native_extensions: 0.10.0-dev.2
  audioplayers_platform_interface: ^7.2.0
  url_launcher_platform_interface: ^2.3.2
  vm_service: ^15.3.0
dependency_overrides:
  # Bound SVG geometry expansion and native pattern bitmap allocations.
  vector_graphics_compiler:
    path: dependencies/vector_graphics_compiler
  # Retained Android hosts switch composition and omit unsubscribed scroll events.
  flutter_inappwebview_android:
    path: dependencies/flutter_inappwebview_android
  # Keep sherpa's federated native packages aligned with the Dart API. Their
  # caret constraints otherwise resolve newer binaries (macOS 13.4/15.5).
  sherpa_onnx_android: 1.12.20

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  shaders:
    - shaders/browser_switch_lens.frag

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/app_icon.png
    - assets/mermaid.min.js
    - assets/html/mark.html
    - assets/model_catalog/models_dev.json
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

#  fonts:
#    - family: JetBrainsMono
#      fonts:
#        - asset: assets/fonts/JetBrainsMono-Regular.ttf

flutter_launcher_icons:
  android: true
  image_path: assets/app_icon_foreground.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon_foreground.png

flutter_native_splash:
  android: true
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/start.png
  image_dark: assets/start.png

  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/start.png
    image_dark: assets/start.png
