name: Android ARM64 Build & Essential Arabic Checks

# Run automatically whenever project files are pushed or a PR is opened/updated.
# Manual execution remains available for debug/release builds on a selected ref.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Android APK build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      run_android_skill_e2e:
        description: Run the optional Phase 13P Skill lifecycle test on an Android emulator (downloads the PRoot runtime on a clean emulator)
        required: false
        default: false
        type: boolean
      phase_test_scope:
        description: Use skill_doctor_recovery only for an isolated PHASE13O fix when PHASE13E–13N passed on the parent commit; otherwise use full.
        required: true
        default: full
        type: choice
        options:
          - full
          - skill_doctor_recovery

permissions:
  contents: read

concurrency:
  # A push to a branch with an open PR and the corresponding PR event share
  # one group, avoiding two expensive Android builds for the same head commit.
  group: kelivo-android-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '17'
  ANDROID_NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'
  BUILD_MODE: ${{ inputs.build_mode || 'release' }}
  PHASE_TEST_SCOPE: ${{ inputs.phase_test_scope || 'full' }}

jobs:
  build-android-arm64:
    name: Audit, Arabic Checks & Build Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v7

      - name: Initialize build report
        id: initialize_report
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          set -euo pipefail
          REPORT_DIR="$GITHUB_WORKSPACE/build-report"
          mkdir -p "$REPORT_DIR/logs"
          echo "KELIVO_CI_REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          date -u +'%Y-%m-%d %H:%M:%S UTC' > "$REPORT_DIR/started_at_utc.txt"
          {
            echo "Repository: ${GITHUB_REPOSITORY:-unknown}"
            echo "Ref: ${GITHUB_REF:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo "Event: ${GITHUB_EVENT_NAME:-unknown}"
            echo "Actor: ${GITHUB_ACTOR:-unknown}"
            echo "Build mode: ${BUILD_MODE:-release}"
            echo "Phase 13 test scope: ${PHASE_TEST_SCOPE}; skill_doctor_recovery skips only PHASE13E–13N for an isolated PHASE13O fix whose parent commit already passed those suites; PHASE13O and PHASE13P diagnostics remain enabled; Android Skill E2E runs on every main push and can also be requested manually; historical PHASE13A–13D tests are not repeated"
          } > "$REPORT_DIR/run-metadata.txt"
          bash .github/scripts/record_ci_action.sh checkout "Checkout source" "$CHECKOUT_OUTCOME"
          bash .github/scripts/record_ci_action.sh initialize_report "Initialize build report" "success" "Report metadata and per-step log directory created."
          printf 'Report initialized at %s\n' "$REPORT_DIR"

      - name: Audit Android-only source tree
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh android_only_audit "Android-only source audit" -- \
            bash .github/scripts/audit_android_only.sh

      - name: Set up Flutter
        id: setup_flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Record Flutter setup outcome
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.setup_flutter.outcome }}
        run: bash .github/scripts/record_ci_action.sh setup_flutter "Set up Flutter ${FLUTTER_VERSION}" "$ACTION_OUTCOME"

      - name: Record toolchain versions
        id: toolchain_versions
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh toolchain_versions "Flutter, Dart and Android SDK versions" -- \
            bash -euo pipefail -c '
              flutter --version
              dart --version
              echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
              echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
              if command -v sdkmanager >/dev/null 2>&1; then sdkmanager --version; fi
            '

      - name: Resolve Flutter application dependencies
        id: flutter_pub_get
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh flutter_pub_get "Resolve Flutter application dependencies" -- \
            bash .github/scripts/resolve_flutter_dependencies.sh

      # Catch syntax/format regressions in the capability registry and Skill
      # import UI before earlier focused lanes load the shared import widget.
      - name: Syntax-check Phase 13K capability registry, Skill import UI and focused tests
        id: phase13k_syntax_preflight
        if: ${{ success() && env.PHASE_TEST_SCOPE != 'skill_doctor_recovery' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13k_syntax_preflight "Syntax-check Phase 13K capability registry, Skill import UI and focused tests" -- \
            dart format --output=none \
              lib/core/services/skills/skill_capability_registry.dart \
              lib/features/workspace/widgets/skills/skill_import.dart \
              test/core/services/skills/skill_readiness_phase13k_test.dart \
              test/features/workspace/skills/skill_catalog_arabic_localization_phase13k_test.dart

      # `flutter test` targets the Linux host. Flutter executes package build
      # hooks from the resolved application dependency graph even when a
      # selected test does not import the package directly. The clipboard
      # dependency therefore compiles super_native_extensions for Linux and
      # requires GTK/GLib development metadata for the focused Phase 13E test lane.
      - name: Prepare Linux host dependencies for Flutter native-asset hooks
        id: linux_test_native_deps
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh linux_test_native_deps "Prepare Linux GTK/GLib headers required by Flutter test hooks" -- \
            bash .github/scripts/prepare_linux_native_test_deps.sh

      - name: Preflight focused Phase 13E regressions
        id: phase13e_preflight
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' && env.PHASE_TEST_SCOPE != 'skill_doctor_recovery' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13e_preflight "Preflight focused Phase 13E regressions" -- \
            bash .github/scripts/preflight_phase13e_tests.sh

      - name: Run focused Phase 13E regression tests
        id: phase13e_tests
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' && env.PHASE_TEST_SCOPE != 'skill_doctor_recovery' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13e_tests "Phase 13E environment, update, approval and package-ledger tests" -- \
            bash .github/scripts/run_phase13e_tests.sh

      - name: Preflight focused Phase 13F Skill and attachment regressions
        id: phase13f_preflight
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' && env.PHASE_TEST_SCOPE != 'skill_doctor_recovery' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13f_preflight "Preflight Phase 13F Skill composition and attachment library" -- \
            bash .github/scripts/preflight_phase13f_tests.sh

      - name: Run focused Phase 13F regressions
        id: phase13f_tests
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' && env.PHASE_TEST_SCOPE != 'skill_doctor_recovery' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13f_tests "Phase 13F Skill composition, multi-file picker and shared upload reuse tests" -- \
            bash .github/scripts/run_phase13f_tests.sh

      - name: Preflight focused Phase 13G background and notification regressions
        id: phase13g_preflight
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' && env.PHASE_TEST_SCOPE != 'skill_doctor_recovery' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13g_preflight "Preflight Phase 13G background execution, approvals and progress notifications" -- \
