        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13o_preflight "Preflight Phase 13O Skill Doctor, manifest integrity and safe Profile probes" -- \
            bash .github/scripts/preflight_phase13o_tests.sh

      - name: Run focused Phase 13O Skill Doctor tests
        id: phase13o_tests
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13o_tests "Phase 13O diagnostics, Skill integrity, readiness and Runtime Profile probe tests" -- \
            bash .github/scripts/run_phase13o_tests.sh

      - name: Syntax-check Phase 13P Skill E2E test and runners
        id: phase13p_syntax_preflight
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13p_syntax_preflight "Syntax-check Phase 13P Android Skill lifecycle integration test" -- \
            dart format --output=none \
              integration_test/workspace/skill_execution_e2e_test.dart

      - name: Validate Phase 13P focused CI wiring
        id: phase13p_ci_self_test
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13p_ci_self_test "Validate Phase 13P focused CI and Android E2E wiring" -- \
            bash .github/scripts/test_phase13p_ci.sh

      - name: Preflight Phase 13P Skill lifecycle coverage
        id: phase13p_preflight
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13p_preflight "Preflight Phase 13P import, Profile, execution, artifact and background assertions" -- \
            bash .github/scripts/preflight_phase13p_tests.sh

      - name: Run focused Phase 13P Skill lifecycle regression tests
        id: phase13p_tests
        if: ${{ !cancelled() && steps.flutter_pub_get.outcome == 'success' && steps.linux_test_native_deps.outcome == 'success' }}
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13p_tests "Phase 13P Skill import, Runtime Profile, executor, artifact and background unit regressions" -- \
            bash .github/scripts/run_phase13p_tests.sh

      - name: Validate Arabic localization key and placeholder parity
        id: l10n_parity
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh l10n_parity "Validate Arabic localization keys and placeholders" -- \
            python3 .github/scripts/check_l10n_parity.py

      - name: Generate Flutter localizations
        id: generate_l10n
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh generate_l10n "Generate Flutter localizations" -- \
            flutter gen-l10n

      - name: Analyze complete Flutter source
        id: full_flutter_analyze
        if: success()
        timeout-minutes: 30
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh full_flutter_analyze "Analyze complete Flutter source" -- \
            flutter analyze --no-pub

      - name: Run complete Flutter unit and widget test suite
        id: full_flutter_tests
        if: success()
        timeout-minutes: 75
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh full_flutter_tests "Run all Flutter unit and widget tests" -- \
            flutter test --no-pub --reporter expanded

      - name: Set up Java
        id: setup_java
        if: success()
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Record Java setup outcome
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.setup_java.outcome }}
        run: bash .github/scripts/record_ci_action.sh setup_java "Set up Java ${JAVA_VERSION}" "$ACTION_OUTCOME"

      - name: Set up Gradle for focused Android runtime tests
        id: setup_gradle
        if: success()
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install pinned Android NDK and CMake
        id: android_sdk_components
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh android_sdk_components "Install Android NDK and CMake" -- \
            bash -euo pipefail -c '
              if command -v sdkmanager >/dev/null 2>&1; then
                SDKMANAGER="$(command -v sdkmanager)"
              elif [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
                SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
              elif [[ -n "${ANDROID_SDK_ROOT:-}" && -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
                SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
              else
                echo "Android sdkmanager was not found on this runner." >&2
                exit 1
              fi

              # sdkmanager closes stdin after accepting licenses. The producer may receive
              # SIGPIPE; capture sdkmanager (the consumer) status instead of failing on yes.
              set +o pipefail
              yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null
              SDKMANAGER_LICENSE_STATUS="${PIPESTATUS[1]:-1}"
              set -o pipefail
              if [[ "$SDKMANAGER_LICENSE_STATUS" -ne 0 ]]; then
                echo "sdkmanager --licenses failed with exit code $SDKMANAGER_LICENSE_STATUS" >&2
                exit "$SDKMANAGER_LICENSE_STATUS"
              fi

              "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}" "cmake;${CMAKE_VERSION}"
              "$SDKMANAGER" --list_installed | grep -E "ndk;${ANDROID_NDK_VERSION}|cmake;${CMAKE_VERSION}" || true
            '

      # Flutter 3.47 can leave GeneratedPluginRegistrant.java containing dev-only
      # plugins after `flutter pub get`. Release Gradle intentionally excludes
      # those plugins from the releaseApi classpath. Regenerate platform tooling
      # in the selected build mode immediately before Gradle, then keep the real
      # build on --no-pub so no later unfiltered pub-get can rewrite the registrant.
      - name: Run complete Android JVM and Robolectric unit test suite
        id: android_full_unit_tests
        if: success()
        timeout-minutes: 30
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh android_full_unit_tests "Run all Android JVM and Robolectric unit tests" -- \
            gradle --no-daemon -p android :app:testDebugUnitTest

      - name: Run Phase 13P Skill lifecycle E2E on Android emulator
        id: phase13p_android_e2e
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_android_skill_e2e == true))
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim'
          script: |
            bash .github/scripts/capture_step.sh phase13p_android_e2e "Phase 13P real Android Skill ZIP-to-output lifecycle" -- \
              bash .github/scripts/run_phase13p_android_e2e.sh

      - name: Prepare build-mode Android plugin registrant
        id: prepare_android_plugin_registrant
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh prepare_android_plugin_registrant "Prepare ${BUILD_MODE} Android plugin registrant" -- \
            bash .github/scripts/prepare_android_plugin_registrant.sh

      - name: Build Android ARM64 APK
        id: build_android_arm64
        if: success()
        timeout-minutes: 35
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh build_android_arm64 "Build Android ARM64 ${BUILD_MODE} APK" -- \
            flutter build apk --no-pub --"$BUILD_MODE" --target-platform android-arm64

      - name: Prepare APK and SHA-256 checksum
        id: package_apk
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh package_apk "Package APK and calculate SHA-256" -- \
            bash .github/scripts/package_android_apk.sh

      - name: Upload Android ARM64 APK
        id: upload_apk
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Kelivo-Android-arm64-v8a-${{ env.BUILD_MODE }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Record APK artifact upload outcome
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.upload_apk.outcome }}
        run: bash .github/scripts/record_ci_action.sh upload_apk "Upload Android APK artifact" "$ACTION_OUTCOME"

      - name: Record build stages that were correctly skipped
        if: always()
        env:
          TOOLCHAIN_VERSIONS_OUTCOME: ${{ steps.toolchain_versions.outcome }}
          PUB_GET_OUTCOME: ${{ steps.flutter_pub_get.outcome }}
          LINUX_TEST_NATIVE_DEPS_OUTCOME: ${{ steps.linux_test_native_deps.outcome }}
          PHASE13E_PREFLIGHT_OUTCOME: ${{ steps.phase13e_preflight.outcome }}
          PHASE13E_TESTS_OUTCOME: ${{ steps.phase13e_tests.outcome }}
          PHASE13M_SYNTAX_PREFLIGHT_OUTCOME: ${{ steps.phase13m_syntax_preflight.outcome }}
          PHASE13M_CI_SELF_TEST_OUTCOME: ${{ steps.phase13m_ci_self_test.outcome }}
          PHASE13M_PREFLIGHT_OUTCOME: ${{ steps.phase13m_preflight.outcome }}
          PHASE13M_TESTS_OUTCOME: ${{ steps.phase13m_tests.outcome }}
          PHASE13N_SYNTAX_PREFLIGHT_OUTCOME: ${{ steps.phase13n_syntax_preflight.outcome }}
          PHASE13N_CI_SELF_TEST_OUTCOME: ${{ steps.phase13n_ci_self_test.outcome }}
          PHASE13N_PREFLIGHT_OUTCOME: ${{ steps.phase13n_preflight.outcome }}
          PHASE13N_TESTS_OUTCOME: ${{ steps.phase13n_tests.outcome }}
          PHASE13N_ANDROID_GUARD_TESTS_OUTCOME: ${{ steps.phase13n_android_guard_tests.outcome }}
          PHASE13O_SYNTAX_PREFLIGHT_OUTCOME: ${{ steps.phase13o_syntax_preflight.outcome }}
          PHASE13O_CI_SELF_TEST_OUTCOME: ${{ steps.phase13o_ci_self_test.outcome }}
          PHASE13O_PREFLIGHT_OUTCOME: ${{ steps.phase13o_preflight.outcome }}
          PHASE13O_TESTS_OUTCOME: ${{ steps.phase13o_tests.outcome }}
          PHASE13P_SYNTAX_PREFLIGHT_OUTCOME: ${{ steps.phase13p_syntax_preflight.outcome }}
          PHASE13P_CI_SELF_TEST_OUTCOME: ${{ steps.phase13p_ci_self_test.outcome }}
          PHASE13P_PREFLIGHT_OUTCOME: ${{ steps.phase13p_preflight.outcome }}
          PHASE13P_TESTS_OUTCOME: ${{ steps.phase13p_tests.outcome }}
          PHASE13P_ANDROID_E2E_OUTCOME: ${{ steps.phase13p_android_e2e.outcome }}
          PHASE13F_PREFLIGHT_OUTCOME: ${{ steps.phase13f_preflight.outcome }}
          PHASE13F_TESTS_OUTCOME: ${{ steps.phase13f_tests.outcome }}
          PHASE13G_PREFLIGHT_OUTCOME: ${{ steps.phase13g_preflight.outcome }}
          PHASE13G_TESTS_OUTCOME: ${{ steps.phase13g_tests.outcome }}
          PHASE13H_CI_SELF_TEST_OUTCOME: ${{ steps.phase13h_ci_self_test.outcome }}
          PHASE13H_PREFLIGHT_OUTCOME: ${{ steps.phase13h_preflight.outcome }}
          PHASE13H_TESTS_OUTCOME: ${{ steps.phase13h_tests.outcome }}
          SETUP_GRADLE_OUTCOME: ${{ steps.setup_gradle.outcome }}
          L10N_PARITY_OUTCOME: ${{ steps.l10n_parity.outcome }}
          GENERATE_L10N_OUTCOME: ${{ steps.generate_l10n.outcome }}
          ANDROID_SDK_COMPONENTS_OUTCOME: ${{ steps.android_sdk_components.outcome }}
          ANDROID_BACKGROUND_UNIT_TESTS_OUTCOME: ${{ steps.android_background_unit_tests.outcome }}
          PHASE13I_CI_SELF_TEST_OUTCOME: ${{ steps.phase13i_ci_self_test.outcome }}
          PHASE13I_PREFLIGHT_OUTCOME: ${{ steps.phase13i_preflight.outcome }}
          PHASE13I_TESTS_OUTCOME: ${{ steps.phase13i_tests.outcome }}
          RELEASE_PLUGIN_REGISTRANT_OUTCOME: ${{ steps.prepare_android_plugin_registrant.outcome }}
          BUILD_ANDROID_OUTCOME: ${{ steps.build_android_arm64.outcome }}
          PACKAGE_APK_OUTCOME: ${{ steps.package_apk.outcome }}
        run: bash .github/scripts/record_skipped_build_stages.sh

      - name: Upload raw build diagnostics for report generation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kelivo-Build-Report-Raw-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-report/
          if-no-files-found: warn
          retention-days: 2

  publish-build-report:
    name: Collect full logs and publish Markdown report
    if: always()
    needs: [build-android-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout report generator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare report directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-report/logs
          echo "KELIVO_CI_REPORT_DIR=$GITHUB_WORKSPACE/build-report" >> "$GITHUB_ENV"

      - name: Download raw command logs and metadata
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Kelivo-Build-Report-Raw-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-report/

      - name: Download complete GitHub Actions job log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_JOB_NAME: Audit, Arabic Checks & Build Android ARM64
        run: |
          set -uo pipefail
          mkdir -p build-report/logs
          exec > >(tee -a build-report/logs/report-job.log) 2>&1
          API_ROOT="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}"
          JOBS_JSON="$RUNNER_TEMP/kelivo-workflow-jobs.json"
          FULL_LOG="build-report/logs/github-actions-full-job.log"

          if ! curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_ROOT/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o "$JOBS_JSON"; then
            echo "Could not retrieve workflow job metadata (Actions: read permission or API availability)." \
              | tee "build-report/logs/github-actions-full-job-download.log"
            exit 0
          fi

          # Preserve the structured step conclusions/durations, including skipped steps.
          cp "$JOBS_JSON" build-report/workflow-jobs.json

          JOB_ID="$(jq -r --arg job_name "$BUILD_JOB_NAME" \
            '.jobs[] | select(.name == $job_name) | .id' "$JOBS_JSON" | head -n 1)"
          if [[ -z "$JOB_ID" || "$JOB_ID" == "null" ]]; then
            echo "Could not find completed build job named: $BUILD_JOB_NAME" \
              | tee "build-report/logs/github-actions-full-job-download.log"
            exit 0
          fi

          # GitHub returns a short-lived redirect to the plain-text job log.
          if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 180 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_ROOT/actions/jobs/$JOB_ID/logs" \
            -o "$FULL_LOG"; then
            echo "Downloaded complete runner log: $FULL_LOG ($(wc -c < "$FULL_LOG") bytes)"
          else
            rm -f "$FULL_LOG"
            echo "Could not download complete runner log; per-command logs remain available." \
              | tee "build-report/logs/github-actions-full-job-download.log"
          fi

      - name: Generate comprehensive Markdown build report
        if: always()
        shell: bash
        env:
          FINAL_JOB_STATUS: ${{ needs['build-android-arm64'].result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          JAVA_VERSION: ${{ env.JAVA_VERSION }}
          ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
          CMAKE_VERSION: ${{ env.CMAKE_VERSION }}
          BUILD_MODE: ${{ env.BUILD_MODE }}
        run: |
          set -uo pipefail
          mkdir -p build-report/logs
          if [[ -f .github/scripts/generate_build_report.py ]]; then
            set +e
            python3 .github/scripts/generate_build_report.py 2>&1 | tee build-report/logs/report-generator.log
            GENERATOR_STATUS="${PIPESTATUS[0]}"
            set -e
            if [[ "$GENERATOR_STATUS" -ne 0 || ! -s build-report/KELIVO_BUILD_REPORT.md ]]; then
              {
                echo '# Kelivo Android Build Report'
                echo
                echo "Report generator failed with exit code: $GENERATOR_STATUS"
                echo "Build job result: $FINAL_JOB_STATUS"
                echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                echo
                echo '## Report-generator diagnostics'
                echo
                cat build-report/logs/report-generator.log 2>/dev/null || true
              } > build-report/KELIVO_BUILD_REPORT.md
            fi
          else
            {
              echo '# Kelivo Android Build Report'
              echo
              echo "Report generator could not be checked out. Build job result: $FINAL_JOB_STATUS"
              echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > build-report/KELIVO_BUILD_REPORT.md
          fi

      - name: Upload complete Markdown report and all available logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kelivo-Build-Report-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-report/
          if-no-files-found: warn
          retention-days: 30
