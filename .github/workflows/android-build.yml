name: Android ARM64 Build & Essential Arabic Checks

# Run on main pushes and pull request updates; manual builds may target a selected ref.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Android APK build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      run_android_skill_e2e:
        description: Run the optional Phase 13P Skill lifecycle test on an Android emulator (downloads the PRoot runtime on a clean emulator)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A push to a branch with an open PR and the corresponding PR event share
  # one group, avoiding two expensive Android builds for the same head commit.
  group: kelivo-android-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  # Robolectric 4.16.1 requires JDK 21 for Android API 36 test sandboxes.
  JAVA_VERSION: '21'
  ANDROID_NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'
  BUILD_MODE: ${{ inputs.build_mode || 'release' }}

jobs:
  build-android-arm64:
    name: Audit, Arabic Checks & Build Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v7

      - name: Initialize build report
        id: initialize_report
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          set -euo pipefail
          REPORT_DIR="$GITHUB_WORKSPACE/build-report"
          mkdir -p "$REPORT_DIR/logs"
          echo "KELIVO_CI_REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          date -u +'%Y-%m-%d %H:%M:%S UTC' > "$REPORT_DIR/started_at_utc.txt"
          {
            echo "Repository: ${GITHUB_REPOSITORY:-unknown}"
            echo "Ref: ${GITHUB_REF:-unknown}"
            echo "Commit: ${GITHUB_SHA:-unknown}"
            echo "Event: ${GITHUB_EVENT_NAME:-unknown}"
            echo "Actor: ${GITHUB_ACTOR:-unknown}"
            echo "Build mode: ${BUILD_MODE:-release}"
            echo "CI gates: Flutter source analysis, Environment install lifecycle regressions, independent local package tests, Android JVM/Robolectric tests, Android Skill E2E and ARM64 APK build"
          } > "$REPORT_DIR/run-metadata.txt"
          bash .github/scripts/record_ci_action.sh checkout "Checkout source" "$CHECKOUT_OUTCOME"
          bash .github/scripts/record_ci_action.sh initialize_report "Initialize build report" "success" "Report metadata and per-step log directory created."
          printf 'Report initialized at %s\n' "$REPORT_DIR"

      - name: Audit Android-only source tree
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh android_only_audit "Android-only source audit" -- \
            bash .github/scripts/audit_android_only.sh

      - name: Set up Flutter
        id: setup_flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Record Flutter setup outcome
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.setup_flutter.outcome }}
        run: bash .github/scripts/record_ci_action.sh setup_flutter "Set up Flutter ${FLUTTER_VERSION}" "$ACTION_OUTCOME"

      # Cache sqlite3 hook downloads across CI runs. The package verifies each
      # precompiled binary against its published SHA-256 before use; retain the
      # package-managed cache layout and key it to the resolved package version.
      - name: Cache sqlite3 native hook binaries
        id: sqlite3_native_cache
        if: success()
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/sqlite3/build/download-*
          key: kelivo-sqlite3-native-3.5.2-linux-x64-v1

      - name: Record toolchain versions
        id: toolchain_versions
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh toolchain_versions "Flutter, Dart and Android SDK versions" -- \
            bash -euo pipefail -c '
              flutter --version
              dart --version
              echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
              echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"
              if command -v sdkmanager >/dev/null 2>&1; then sdkmanager --version; fi
            '

      - name: Resolve Flutter application dependencies
        id: flutter_pub_get
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh flutter_pub_get "Resolve Flutter application dependencies" -- \
            bash .github/scripts/resolve_flutter_dependencies.sh

      # Catch syntax/format regressions in the capability registry and Skill
      # import UI before earlier focused lanes load the shared import widget.
      - name: Prepare Linux host dependencies for Flutter native-asset hooks
        id: linux_test_native_deps
        if: success()
        timeout-minutes: 30
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh linux_test_native_deps "Prepare Linux GTK/GLib headers required by Flutter native-asset hooks" -- \
            bash .github/scripts/prepare_linux_native_test_deps.sh

      - name: Validate Arabic localization key and placeholder parity
        id: l10n_parity
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh l10n_parity "Validate Arabic localization keys and placeholders" -- \
            python3 .github/scripts/check_l10n_parity.py

      - name: Generate Flutter localizations
        id: generate_l10n
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh generate_l10n "Generate Flutter localizations" -- \
            flutter gen-l10n

      - name: Analyze complete Flutter source
        id: full_flutter_analyze
        if: success()
        timeout-minutes: 30
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh full_flutter_analyze "Analyze complete Flutter source" -- \
            bash .github/scripts/run_flutter_analyze_gate.sh

      - name: Run Environment install lifecycle regression tests
        id: environment_install_lifecycle_tests
        if: success()
        timeout-minutes: 45
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh environment_install_lifecycle_tests "Environment installation lifecycle regressions" -- \
            bash .github/scripts/run_environment_install_lifecycle_tests.sh

      - name: Run Phase 14A progressive Skill discovery tests
        id: phase14a_progressive_skill_tests
        if: success()
        timeout-minutes: 15
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase14a_progressive_skill_tests "Phase 14A metadata-first Skill composition and lazy instruction loading" -- \
            flutter test --no-pub --concurrency=2 \
              test/core/services/skills/skill_composition_service_phase14a_test.dart \
              test/core/services/skills/skill_composition_planner_test.dart \
              test/core/services/skills/skill_frontmatter_test.dart

      - name: Run Gemini schema and provider OAuth regression tests
        id: provider_oauth_and_gemini_schema_tests
        if: success()
        timeout-minutes: 25
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh provider_oauth_and_gemini_schema_tests "Gemini tool schema and provider OAuth regression tests" -- \
            flutter test --no-pub --concurrency=2 \
              test/core/services/api/gemini_tool_schema_request_test.dart \
              test/core/services/api/providers/google/google_api_error_message_test.dart \
              test/core/services/auth/provider_oauth_adapter_test.dart

      - name: Run Phase 13Q Skill MCP configuration discovery tests
        id: phase13q_mcp_config_tests
        if: success()
        timeout-minutes: 10
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh phase13q_mcp_config_tests "Phase 13Q read-only Skill MCP configuration discovery" -- \
            bash .github/scripts/run_phase13q_tests.sh

      # Local path dependencies have independent pubspecs and test suites.
      # Running their tests from the app root does not cover these test trees.
      - name: Run vendored local package test suites
        id: local_package_tests
        if: success()
        timeout-minutes: 75
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh local_package_tests "Run independent local package test suites" -- \
            bash .github/scripts/run_local_package_tests.sh

      - name: Set up Java
        id: setup_java
        if: success()
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Record Java setup outcome
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.setup_java.outcome }}
        run: bash .github/scripts/record_ci_action.sh setup_java "Set up Java ${JAVA_VERSION}" "$ACTION_OUTCOME"

      - name: Set up Gradle dependency repositories and retry policy
        id: gradle_repository_policy
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Maven Central may rate-limit fresh hosted runners with HTTP 429.
          # Keep the repository changes narrowly scoped to plugin resolution and
          # use Gradle's bounded HTTP retry policy instead of disabling failures.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/settings.gradle.kts")
          text = path.read_text()
          text = text.replace(
              "    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }",
              """    repositories {
                  google()
                  maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
                  mavenCentral()
                  gradlePluginPortal()
              }"""
          )
          if "maven-central.storage-download.googleapis.com" not in text:
              raise SystemExit("Plugin mirror insertion failed; refusing to continue.")
          path.write_text(text)
          PY
          printf '\n# Bounded retries for transient Maven Central/Plugin Portal throttling.\nsystemProp.org.gradle.internal.repository.max.retries=5\nsystemProp.org.gradle.internal.repository.max.backoff=10000\n' >> android/gradle.properties
          git diff --check -- android/settings.gradle.kts android/gradle.properties
          echo "Plugin-management mirror and bounded Gradle retry policy configured."

      - name: Set up Gradle for focused Android runtime tests
        id: setup_gradle
        if: success()
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install pinned Android NDK and CMake
        id: android_sdk_components
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh android_sdk_components "Install Android NDK and CMake" -- \
            bash -euo pipefail -c '
              if command -v sdkmanager >/dev/null 2>&1; then
                SDKMANAGER="$(command -v sdkmanager)"
              elif [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
                SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
              elif [[ -n "${ANDROID_SDK_ROOT:-}" && -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
                SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
              else
                echo "Android sdkmanager was not found on this runner." >&2
                exit 1
              fi

              # sdkmanager closes stdin after accepting licenses. The producer may receive
              # SIGPIPE; capture sdkmanager (the consumer) status instead of failing on yes.
              set +o pipefail
              yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null
              SDKMANAGER_LICENSE_STATUS="${PIPESTATUS[1]:-1}"
              set -o pipefail
              if [[ "$SDKMANAGER_LICENSE_STATUS" -ne 0 ]]; then
                echo "sdkmanager --licenses failed with exit code $SDKMANAGER_LICENSE_STATUS" >&2
                exit "$SDKMANAGER_LICENSE_STATUS"
              fi

              "$SDKMANAGER" "ndk;${ANDROID_NDK_VERSION}" "cmake;${CMAKE_VERSION}"
              "$SDKMANAGER" --list_installed | grep -E "ndk;${ANDROID_NDK_VERSION}|cmake;${CMAKE_VERSION}" || true
            '

      # Flutter 3.47 can leave GeneratedPluginRegistrant.java containing dev-only
      # plugins after `flutter pub get`. Release Gradle intentionally excludes
      # those plugins from the releaseApi classpath. Regenerate platform tooling
      # in the selected build mode immediately before Gradle, then keep the real
      # build on --no-pub so no later unfiltered pub-get can rewrite the registrant.
      - name: Run complete Android JVM and Robolectric unit test suite
        id: android_full_unit_tests
        if: success()
        timeout-minutes: 30
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh android_full_unit_tests "Run all Android JVM and Robolectric unit tests" -- \
            gradle --no-daemon -p android :app:testDebugUnitTest

      - name: Prepare KVM access for Android emulator
        id: prepare_android_kvm
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_android_skill_e2e == true))
        shell: bash
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo "This runner does not expose /dev/kvm; use a KVM-capable Linux runner for Android E2E." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run Phase 13P Skill lifecycle E2E on Android emulator
        id: phase13p_android_e2e
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_android_skill_e2e == true))
        timeout-minutes: 90
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The preflight grants this runner read/write access to /dev/kvm.
          # Let the action detect KVM and use hardware acceleration rather than TCG.
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 1200
          # The app/WebView integration test launches Chromium and the Flutter engine.
          # Give the x86_64 guest enough RAM for the full native WebView lifecycle.
          emulator-options: '-no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -memory 3072'
          script: |
            bash .github/scripts/capture_step.sh phase13p_android_e2e "Phase 13P real Android Skill ZIP-to-output lifecycle" -- bash .github/scripts/run_phase13p_android_e2e.sh

      - name: Prepare build-mode Android plugin registrant
        id: prepare_android_plugin_registrant
        if: success()
        env:
          # Keep the production configuration explicit after the emulator's
          # temporary x86_64 Debug build.
          ORG_GRADLE_PROJECT_kelivoE2E: 'false'
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh prepare_android_plugin_registrant "Prepare ${BUILD_MODE} Android plugin registrant" -- \
            bash .github/scripts/prepare_android_plugin_registrant.sh

      - name: Build Android ARM64 APK
        id: build_android_arm64
        if: success()
        timeout-minutes: 35
        env:
          ORG_GRADLE_PROJECT_kelivoE2E: 'false'
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh build_android_arm64 "Build Android ARM64 ${BUILD_MODE} APK" -- \
            flutter build apk --no-pub --"$BUILD_MODE" --target-platform android-arm64

      - name: Prepare APK and SHA-256 checksum
        id: package_apk
        if: success()
        shell: bash
        run: |
          bash .github/scripts/capture_step.sh package_apk "Package APK and calculate SHA-256" -- \
            bash .github/scripts/package_android_apk.sh

      - name: Upload Android ARM64 APK
        id: upload_apk
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Kelivo-Android-arm64-v8a-${{ env.BUILD_MODE }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Record APK artifact upload outcome
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.upload_apk.outcome }}
        run: bash .github/scripts/record_ci_action.sh upload_apk "Upload Android APK artifact" "$ACTION_OUTCOME"

      - name: Record build stages that were correctly skipped
        if: always()
        env:
          TOOLCHAIN_VERSIONS_OUTCOME: ${{ steps.toolchain_versions.outcome }}
          PUB_GET_OUTCOME: ${{ steps.flutter_pub_get.outcome }}
          PHASE13P_ANDROID_E2E_OUTCOME: ${{ steps.phase13p_android_e2e.outcome }}
          SETUP_GRADLE_OUTCOME: ${{ steps.setup_gradle.outcome }}
          LINUX_TEST_NATIVE_DEPS_OUTCOME: ${{ steps.linux_test_native_deps.outcome }}
          L10N_PARITY_OUTCOME: ${{ steps.l10n_parity.outcome }}
          GENERATE_L10N_OUTCOME: ${{ steps.generate_l10n.outcome }}
          FULL_FLUTTER_ANALYZE_OUTCOME: ${{ steps.full_flutter_analyze.outcome }}
          ANDROID_SDK_COMPONENTS_OUTCOME: ${{ steps.android_sdk_components.outcome }}
          ANDROID_FULL_UNIT_TESTS_OUTCOME: ${{ steps.android_full_unit_tests.outcome }}
          RELEASE_PLUGIN_REGISTRANT_OUTCOME: ${{ steps.prepare_android_plugin_registrant.outcome }}
          BUILD_ANDROID_OUTCOME: ${{ steps.build_android_arm64.outcome }}
          PACKAGE_APK_OUTCOME: ${{ steps.package_apk.outcome }}
        run: bash .github/scripts/record_skipped_build_stages.sh

      - name: Upload raw build diagnostics for report generation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kelivo-Build-Report-Raw-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-report/
          if-no-files-found: warn
          retention-days: 2

  publish-build-report:
    name: Collect full logs and publish Markdown report
    if: always()
    needs: [build-android-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout report generator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Prepare report directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-report/logs
          echo "KELIVO_CI_REPORT_DIR=$GITHUB_WORKSPACE/build-report" >> "$GITHUB_ENV"

      - name: Download raw command logs and metadata
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Kelivo-Build-Report-Raw-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-report/

      - name: Download complete GitHub Actions job log
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_JOB_NAME: Audit, Arabic Checks & Build Android ARM64
        run: |
          set -uo pipefail
          mkdir -p build-report/logs
          exec > >(tee -a build-report/logs/report-job.log) 2>&1
          API_ROOT="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}"
          JOBS_JSON="$RUNNER_TEMP/kelivo-workflow-jobs.json"
          FULL_LOG="build-report/logs/github-actions-full-job.log"

          if ! curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_ROOT/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            -o "$JOBS_JSON"; then
            echo "Could not retrieve workflow job metadata (Actions: read permission or API availability)." \
              | tee "build-report/logs/github-actions-full-job-download.log"
            exit 0
          fi

          # Preserve the structured step conclusions/durations, including skipped steps.
          cp "$JOBS_JSON" build-report/workflow-jobs.json

          JOB_ID="$(jq -r --arg job_name "$BUILD_JOB_NAME" \
            '.jobs[] | select(.name == $job_name) | .id' "$JOBS_JSON" | head -n 1)"
          if [[ -z "$JOB_ID" || "$JOB_ID" == "null" ]]; then
            echo "Could not find completed build job named: $BUILD_JOB_NAME" \
              | tee "build-report/logs/github-actions-full-job-download.log"
            exit 0
          fi

          # GitHub returns a short-lived redirect to the plain-text job log.
          if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 180 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_ROOT/actions/jobs/$JOB_ID/logs" \
            -o "$FULL_LOG"; then
            echo "Downloaded complete runner log: $FULL_LOG ($(wc -c < "$FULL_LOG") bytes)"
          else
            rm -f "$FULL_LOG"
            echo "Could not download complete runner log; per-command logs remain available." \
              | tee "build-report/logs/github-actions-full-job-download.log"
          fi

      - name: Generate comprehensive Markdown build report
        if: always()
        shell: bash
        env:
          FINAL_JOB_STATUS: ${{ needs['build-android-arm64'].result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          JAVA_VERSION: ${{ env.JAVA_VERSION }}
          ANDROID_NDK_VERSION: ${{ env.ANDROID_NDK_VERSION }}
          CMAKE_VERSION: ${{ env.CMAKE_VERSION }}
          BUILD_MODE: ${{ env.BUILD_MODE }}
        run: |
          set -uo pipefail
          mkdir -p build-report/logs
          if [[ -f .github/scripts/generate_build_report.py ]]; then
            set +e
            python3 .github/scripts/generate_build_report.py 2>&1 | tee build-report/logs/report-generator.log
            GENERATOR_STATUS="${PIPESTATUS[0]}"
            set -e
            if [[ "$GENERATOR_STATUS" -ne 0 || ! -s build-report/KELIVO_BUILD_REPORT.md ]]; then
              {
                echo '# Kelivo Android Build Report'
                echo
                echo "Report generator failed with exit code: $GENERATOR_STATUS"
                echo "Build job result: $FINAL_JOB_STATUS"
                echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                echo
                echo '## Report-generator diagnostics'
                echo
                cat build-report/logs/report-generator.log 2>/dev/null || true
              } > build-report/KELIVO_BUILD_REPORT.md
            fi
          else
            {
              echo '# Kelivo Android Build Report'
              echo
              echo "Report generator could not be checked out. Build job result: $FINAL_JOB_STATUS"
              echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > build-report/KELIVO_BUILD_REPORT.md
          fi

      - name: Upload complete Markdown report and all available logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Kelivo-Build-Report-${{ github.run_number }}-${{ github.run_attempt }}
          path: build-report/
          if-no-files-found: warn
          retention-days: 30
